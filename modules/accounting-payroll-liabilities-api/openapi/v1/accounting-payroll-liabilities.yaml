openapi: 3.1.0
info: {title: Accounting payroll liabilities API, version: 1.0.0}
paths:
  /api/v1/accounting/payroll-liabilities:
    get: {operationId: accounting.payroll.liabilities.list, responses: {'200': {description: Liabilities}}}

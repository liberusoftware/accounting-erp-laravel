openapi: 3.1.0
info:
  title: accounting sage accounting migration API
  version: 1.0.0
paths:
  /api/v1/accounting/sage-accounting-migration:
    get: {operationId: accounting.sage.accounting.migration.list, responses: {'200': {description: Authorized migration runs}}}
    post: {operationId: accounting.sage.accounting.migration.create, responses: {'201': {description: Migration imported}}}
  /api/v1/accounting/sage-accounting-migration/{run}:
    get: {operationId: accounting.sage.accounting.migration.get, responses: {'200': {description: Migration run}}}
  /api/v1/accounting/sage-accounting-migration/{run}/reconcile:
    post: {operationId: accounting.sage.accounting.migration.reconcile, responses: {'200': {description: Reconciled migration}}}

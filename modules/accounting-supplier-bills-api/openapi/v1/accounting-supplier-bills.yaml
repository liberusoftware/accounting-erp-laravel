openapi: 3.1.0
info:
  title: Accounting Supplier Bills API
  version: 1.0.0
paths:
  /api/v1/accounting/supplier-bills:
    get:
      operationId: accounting.supplier.bills.list
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - { name: party_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [draft, approved, posted, rejected, void] } }
      responses: {'200': {$ref: '#/components/responses/Collection'}}
    post:
      operationId: accounting.supplier.bills.create
      security: [{ sanctum: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierBillRequest' } } } }
      responses: {'201': {$ref: '#/components/responses/Resource'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/accounting/supplier-bills/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: accounting.supplier.bills.get
      security: [{ sanctum: [] }]
      responses: {'200': {$ref: '#/components/responses/Resource'}, '404': {$ref: '#/components/responses/Problem'}}
    patch:
      operationId: accounting.supplier.bills.update
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierBillRequest' } } } }
      responses: {'200': {$ref: '#/components/responses/Resource'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/accounting/supplier-bills/{id}/approve:
    post: { operationId: accounting.supplier.bills.approve, security: [{ sanctum: [] }], responses: {'200': {$ref: '#/components/responses/Resource'}}
  /api/v1/accounting/supplier-bills/{id}/post:
    post: { operationId: accounting.supplier.bills.post, security: [{ sanctum: [] }], parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: {'200': {$ref: '#/components/responses/Resource'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/accounting/supplier-bills/{id}/credits:
    post: { operationId: accounting.supplier.bills.credit, security: [{ sanctum: [] }], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CreditRequest' } } } }, responses: {'200': {$ref: '#/components/responses/Resource'}}
  /api/v1/accounting/supplier-bills/{id}/matches:
    post: { operationId: accounting.supplier.bills.match, security: [{ sanctum: [] }], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/MatchRequest' } } } }, responses: {'200': {$ref: '#/components/responses/Resource'}}
components:
  securitySchemes:
    sanctum: { type: http, scheme: bearer, bearerFormat: Sanctum }
  parameters:
    PageSize: { name: page[size], in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    IfMatch: { name: If-Match, in: header, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16 } }
  schemas:
    SupplierBillRequest:
      type: object
      required: [party_id, bill_date, currency, lines]
      properties:
        party_id: { type: integer, minimum: 1 }
        bill_number: { type: string, maxLength: 80 }
        bill_date: { type: string, format: date }
        due_on: { type: [string, 'null'], format: date }
        currency: { type: string, minLength: 3, maxLength: 3 }
        capture_source: { type: [string, 'null'] }
        purchase_order_reference: { type: [string, 'null'] }
        reference_number: { type: [string, 'null'] }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/SupplierBillLine' } }
    SupplierBillLine:
      type: object
      required: [description, quantity, unit_price]
      properties:
        account_code: { type: [string, 'null'] }
        description: { type: string }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit_price: { type: number, minimum: 0 }
        discount_rate: { type: number, minimum: 0, maximum: 100 }
        tax_rate: { type: number, minimum: 0 }
    CreditRequest:
      type: object
      required: [amount, reason]
      properties: { amount: { type: number, exclusiveMinimum: 0 }, currency: { type: string }, reason: { type: string }, reference: { type: string } }
    MatchRequest:
      type: object
      required: [match_type, matched_type, matched_id]
      properties: { match_type: { type: string }, matched_type: { type: string }, matched_id: { type: string }, quantity: { type: number }, amount: { type: number } }
    Resource:
      type: object
      required: [id, type, attributes]
      properties:
        id: { type: string }
        type: { type: string, const: accounting-supplier-bills }
        attributes: { type: object, additionalProperties: true }
  responses:
    Resource: { description: Supplier bill resource, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
    Collection: { description: Paginated supplier bill resources, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Resource' } }, meta: { type: object }, links: { type: object } } } } } }
    Problem: { description: RFC 9457 problem details, content: { application/problem+json: { schema: { type: object, required: [title, status], properties: { title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string } } } } } }

openapi: 3.1.0
info:
  title: accounting bank feeds API
  version: 1.0.0
paths:
  /api/v1/accounting/bank-feeds:
    get:
      operationId: accounting.bank-feeds.list
      security: [{sanctum: []}]
      parameters: [{'$ref': '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/ResourceCollection'}}
    post:
      operationId: accounting.bank-feeds.connect
      security: [{sanctum: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConnectionCreate'}}}}
      responses: {'201': {$ref: '#/components/responses/Resource'}}
  /api/v1/accounting/bank-feeds/institutions:
    post:
      operationId: accounting.bank-feeds.institution.upsert
      security: [{sanctum: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InstitutionCreate'}}}}
      responses: {'200': {$ref: '#/components/responses/Institution'}}
  /api/v1/accounting/bank-feeds/{connection}:
    get:
      operationId: accounting.bank-feeds.get
      security: [{sanctum: []}]
      parameters: [{'$ref': '#/components/parameters/ConnectionId'}]
      responses: {'200': {$ref: '#/components/responses/Resource'}}
  /api/v1/accounting/bank-feeds/{connection}/mapping:
    post:
      operationId: accounting.bank-feeds.mapping.create
      security: [{sanctum: []}]
      parameters: [{'$ref': '#/components/parameters/ConnectionId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MappingCreate'}}}}
      responses: {'200': {$ref: '#/components/responses/Mapping'}}
  /api/v1/accounting/bank-feeds/{connection}/imports:
    post:
      operationId: accounting.bank-feeds.import
      security: [{sanctum: []}]
      parameters: [{'$ref': '#/components/parameters/ConnectionId'}, {'$ref': '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ImportCreate'}}}}
      responses: {'202': {$ref: '#/components/responses/Resource'}, '409': {$ref: '#/components/responses/Problem'}}
components:
  securitySchemes:
    sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}
  parameters:
    PageSize: {name: page[size], in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    ConnectionId: {name: connection, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 255}}
  schemas:
    InstitutionCreate:
      type: object
      required: [provider, external_id, name]
      properties:
        provider: {type: string, maxLength: 80}
        external_id: {type: string, maxLength: 180}
        name: {type: string, maxLength: 160}
        country: {type: string, minLength: 2, maxLength: 2, nullable: true}
        logo_url: {type: string, format: uri, nullable: true}
        metadata: {type: object, additionalProperties: true}
    ConnectionCreate:
      type: object
      required: [institution_id, provider, name, external_reference, access_token]
      properties:
        institution_id: {type: integer}
        provider: {type: string, maxLength: 80}
        name: {type: string, maxLength: 160}
        external_reference: {type: string, maxLength: 180}
        access_token: {type: string, writeOnly: true}
        credentials: {type: object, additionalProperties: true, writeOnly: true}
        metadata: {type: object, additionalProperties: true}
    MappingCreate:
      type: object
      required: [bank_account_id, external_account_id, name, currency]
      properties:
        bank_account_id: {type: integer}
        external_account_id: {type: string, maxLength: 180}
        name: {type: string, maxLength: 160}
        currency: {type: string, minLength: 3, maxLength: 3}
        metadata: {type: object, additionalProperties: true}
    ImportCreate:
      type: object
      properties:
        added: {type: array, items: {type: object, additionalProperties: true}}
        modified: {type: array, items: {type: object, additionalProperties: true}}
        removed: {type: array, items: {type: string}}
        next_cursor: {type: string, nullable: true}
    BankFeedResource:
      type: object
      required: [id, type, attributes]
      properties:
        id: {type: string}
        type: {type: string, const: accounting-bank-feed}
        attributes: {type: object, additionalProperties: true}
  responses:
    Resource: {description: Bank feed connection, content: {application/json: {schema: {$ref: '#/components/schemas/BankFeedResource'}}}}
    Institution: {description: Bank feed institution, content: {application/json: {schema: {type: object}}}}
    Mapping: {description: Bank account mapping, content: {application/json: {schema: {type: object}}}}
    ResourceCollection: {description: Authorized paginated connections, content: {application/json: {schema: {type: object}}}}
    Problem: {description: RFC 9457 problem, content: {application/problem+json: {schema: {type: object}}}}

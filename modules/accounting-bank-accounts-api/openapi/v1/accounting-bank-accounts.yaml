openapi: 3.1.0
info:
  title: Accounting Bank Accounts API
  version: 1.0.0
servers: [{url: /}]
paths:
  /api/v1/accounting/bank-accounts:
    get: {operationId: accounting.bankAccounts.list, security: [{sanctum: []}], responses: {'200': {description: Bank accounts}}}
    post: {operationId: accounting.bankAccounts.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BankAccountCreate'}}}}, responses: {'201': {description: Account created}}}
  /api/v1/accounting/bank-accounts/{bankAccount}:
    get: {operationId: accounting.bankAccounts.show, security: [{sanctum: []}], parameters: [{name: bankAccount, in: path, required: true, schema: {type: integer}}], responses: {'200': {description: Bank account}}}
    patch: {operationId: accounting.bankAccounts.update, security: [{sanctum: []}], parameters: [{name: bankAccount, in: path, required: true, schema: {type: integer}}], responses: {'200': {description: Account updated}}}
  /api/v1/accounting/bank-accounts/{bankAccount}/status:
    post: {operationId: accounting.bankAccounts.status, security: [{sanctum: []}], parameters: [{name: bankAccount, in: path, required: true, schema: {type: integer}}], responses: {'200': {description: Status changed}}}
components:
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
  schemas:
    BankAccountCreate:
      type: object
      required: [legal_entity_id, name, account_type, currency, opening_balance, opening_date]
      properties:
        legal_entity_id: {type: integer}
        name: {type: string, maxLength: 160}
        account_type: {type: string, enum: [bank, current, savings, credit, loan, cash]}
        currency: {type: string, minLength: 3, maxLength: 3}
        opening_balance: {type: number, minimum: 0}
        opening_date: {type: string, format: date}

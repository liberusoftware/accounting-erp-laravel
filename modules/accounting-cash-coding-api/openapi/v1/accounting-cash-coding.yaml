openapi: 3.1.0
info:
  title: accounting cash coding API
  version: 1.0.0
paths:
  /api/v1/accounting/cash-coding:
    get:
      operationId: accounting.cash.coding.list
      security: [{sanctum: []}]
      parameters: [{'$ref': '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/ResourceCollection'}}
    post:
      operationId: accounting.cash.coding.create
      security: [{sanctum: []}]
      parameters: [{'$ref': '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CashCodingCreate'}}}}
      responses: {'201': {$ref: '#/components/responses/Resource'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/accounting/cash-coding/{batch}:
    get:
      operationId: accounting.cash.coding.get
      security: [{sanctum: []}]
      parameters: [{'$ref': '#/components/parameters/BatchId'}]
      responses: {'200': {$ref: '#/components/responses/Resource'}}
  /api/v1/accounting/cash-coding/{batch}/review:
    post:
      operationId: accounting.cash.coding.review
      security: [{sanctum: []}]
      parameters: [{'$ref': '#/components/parameters/BatchId'}, {'$ref': '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/Resource'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/accounting/cash-coding/{batch}/post:
    post:
      operationId: accounting.cash.coding.post
      security: [{sanctum: []}]
      parameters: [{'$ref': '#/components/parameters/BatchId'}, {'$ref': '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/Resource'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/accounting/cash-coding/{batch}/undo:
    post:
      operationId: accounting.cash.coding.undo
      security: [{sanctum: []}]
      parameters: [{'$ref': '#/components/parameters/BatchId'}, {'$ref': '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 2000}}}}}}
      responses: {'200': {$ref: '#/components/responses/Resource'}, '409': {$ref: '#/components/responses/Problem'}}
components:
  securitySchemes:
    sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}
  parameters:
    PageSize: {name: page[size], in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    BatchId: {name: batch, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 255}}
  schemas:
    CashCodingCreate:
      type: object
      required: [reference, currency, lines]
      properties:
        reference: {type: string, maxLength: 180}
        currency: {type: string, minLength: 3, maxLength: 3}
        lines: {type: array, minItems: 1, maxItems: 500, items: {type: object, required: [source_reference, amount, currency, account_id], additionalProperties: true}}
        payee_creation_policy: {type: string, enum: [never, review, allow], default: never}
    AccountingCashCodingResource:
      type: object
      required: [id, type, attributes]
      properties:
        id: {type: string}
        type: {type: string, const: accounting-cash-coding}
        attributes: {type: object, additionalProperties: true}
  responses:
    Resource: {description: Cash coding batch, content: {application/json: {schema: {$ref: '#/components/schemas/AccountingCashCodingResource'}}}}
    ResourceCollection: {description: Authorized paginated batches, content: {application/json: {schema: {type: object}}}}
    Problem: {description: RFC 9457 problem, content: {application/problem+json: {schema: {type: object}}}}
